name: Request a device
description: Ask for periph to support a keyboard, mouse, headset, controller, wheel or anything else.
title: "[Device] "
labels: ["device-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! New devices are added in a monthly batch. The more detail you give, the faster yours lands.
        If periph is installed, run `periph devices` in a terminal (or open **All devices** in the app) and paste what it shows for your device.
  - type: input
    id: device
    attributes:
      label: Brand and model
      description: Exactly as printed on the box or the device.
      placeholder: e.g. Attack Shark X68HE, Razer Viper V3 Pro, Thrustmaster T300 RS
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of device is it?
      options:
        - Keyboard
        - Hall-effect / analog keyboard
        - Mouse
        - Headset
        - Game controller
        - Racing wheel / pedals / shifter
        - Stream Deck / macro pad
        - Drawing tablet
        - RGB lighting (strip, mat, dock…)
        - Other
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: USB ID (VID:PID)
      description: From `periph devices`, the app's device list, Device Manager (Windows) or System Information → USB (Mac). Leave blank if you're not sure.
      placeholder: e.g. 1532:00C0
  - type: dropdown
    id: connection
    attributes:
      label: How is it connected?
      multiple: true
      options:
        - USB cable
        - 2.4 GHz dongle
        - Bluetooth
  - type: dropdown
    id: os
    attributes:
      label: Your OS
      multiple: true
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: What do you want to control?
      description: List everything the official software can do that you'd like in periph.
      placeholder: e.g. actuation point per key, rapid trigger, RGB effects, DPI stages, polling rate, battery…
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Official software
      description: Name or link of the vendor app or web configurator you'd otherwise use.
      placeholder: e.g. https://… or "Razer Synapse"
  - type: checkboxes
    id: help
    attributes:
      label: Can you help test?
      options:
        - label: I can try a test build and report back
        - label: I can record a USB capture of the official software (instructions will be posted on this issue if needed)
