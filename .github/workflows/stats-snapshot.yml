# Hourly snapshot of the public download counts, so the stats page can chart them over time.
# GitHub only reports running totals; this appends them to history.json on the orphan branch
# "stats-data" (not main, so GitHub Pages doesn't rebuild for every snapshot). The page reads
# https://raw.githubusercontent.com/hiuih/periph-site/stats-data/history.json
# Collected: release asset download counts, stars / forks / watchers, the latest release. Nothing else.
name: stats snapshot

on:
  schedule:
    - cron: "41 * * * *"      # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record a snapshot on stats-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp .github/scripts/stats_snapshot.py "$RUNNER_TEMP/stats_snapshot.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stats-data >/dev/null; then
            git fetch --depth=1 origin stats-data
            git switch --detach FETCH_HEAD
          else
            echo "stats-data doesn't exist yet: starting it with the first snapshot"
            git switch --orphan stats-data
          fi
          if [ ! -f README.md ]; then
            printf '%s\n' "# stats-data" "" \
              "Hourly snapshots of periph's public download counts (history.json), written by the" \
              "\"stats snapshot\" workflow on main and read by the stats page. Don't edit by hand." > README.md
          fi
          python3 "$RUNNER_TEMP/stats_snapshot.py" --repo "$GITHUB_REPOSITORY" --history history.json
          git add history.json README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:refs/heads/stats-data
