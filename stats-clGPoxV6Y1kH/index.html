<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="periph stats">
<title>periph · downloads</title>
<link rel="icon" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
@font-face { font-family: "Bricolage"; src: url("../fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Plex"; src: url("../fonts/plex.woff2") format("woff2"); font-weight: 100 700; }
@font-face { font-family: "Mono"; src: url("../fonts/mono.woff2") format("woff2"); font-weight: 100 800; }
:root {
  --bg: #0b0c0e; --panel: #121418; --line: #22262d; --fg: #eef0f2; --muted: #8a919c; --lime: #d4ff3a; --mac: #8fb3ff;
  --display: "Bricolage", system-ui, sans-serif; --body: "Plex", system-ui, sans-serif; --mono: "Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
body { min-height: 100vh; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, 4vw, env(safe-area-inset-right, 0px)) max(48px, env(safe-area-inset-bottom, 0px)) max(16px, 4vw, env(safe-area-inset-left, 0px)); }
body::before {
  content: ""; position: fixed; inset: -20% -10% auto auto; width: 60vw; height: 60vw; pointer-events: none; z-index: 0;
  background: radial-gradient(closest-side, rgba(212,255,58,.10), transparent 70%); filter: blur(10px);
}
main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 36px; height: 36px; border-radius: 9px; }
.brand h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: -.02em; }
.live { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(212,255,58,.6); animation: pulse 2s infinite; }
.dot.err { background: #ff5c5c; animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(212,255,58,0); } 100% { box-shadow: 0 0 0 0 rgba(212,255,58,0); } }
button { font: 500 12px var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: border-color .2s, transform .15s; }
button:hover { border-color: var(--lime); } button:active { transform: scale(.96); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.card { --mx: 50%; --my: 50%; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; overflow: hidden; min-width: 0; }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(240px circle at var(--mx) var(--my), rgba(212,255,58,.09), transparent 60%); }
.card:hover::after { opacity: 1; }
.label { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.hero { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; }
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr 1fr; gap: 12px; }
  .hero .card:first-child { grid-column: 1 / -1; }
  .mid { font-size: 44px !important; }
  .card { padding: 18px; }
}
.big { font: 800 clamp(64px, 11vw, 132px)/.95 var(--display); letter-spacing: -.05em; color: var(--lime); font-variant-numeric: tabular-nums; margin-top: 10px; text-shadow: 0 0 40px rgba(212,255,58,.25); }
.mid { font: 700 56px/1 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 10px; }
.sub { font: 400 12px var(--mono); color: var(--muted); margin-top: 8px; }
.os { display: flex; align-items: center; gap: 8px; }
.os i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.split h2, .table h2 { margin: 0 0 14px; font: 700 18px var(--display); letter-spacing: -.01em; }
.bar { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: #1a1d22; }
.bar div { height: 100%; width: 0; transition: width 1.1s cubic-bezier(.2,.9,.2,1); }
.bar .w { background: linear-gradient(90deg, #b8e620, var(--lime)); box-shadow: 0 0 18px rgba(212,255,58,.35); }
.bar .m { background: linear-gradient(90deg, #6d93ea, var(--mac)); }
.legend { display: flex; justify-content: space-between; margin-top: 10px; font: 500 12px var(--mono); color: var(--muted); }

.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; }
td.n { font: 700 16px var(--display); }
tr { opacity: 0; transform: translateY(6px); animation: in .5s forwards; }
@keyframes in { to { opacity: 1; transform: none; } }
.msg { font: 400 13px var(--mono); color: #ff8a8a; }
.hero .card { opacity: 0; transform: translateY(12px); animation: in .7s cubic-bezier(.2,.9,.2,1) forwards; }
.hero .card:nth-child(2) { animation-delay: .08s; } .hero .card:nth-child(3) { animation-delay: .16s; }

/* lock screen */
.lock { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: var(--bg); }
.lock form { width: min(360px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; animation: in .6s cubic-bezier(.2,.9,.2,1) both; opacity: 0; transform: translateY(10px); }
.lock img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 0 40px rgba(212,255,58,.25); }
.lock h2 { margin: 6px 0 0; font: 800 28px/1 var(--display); letter-spacing: -.03em; }
.lock p { margin: 0; color: var(--muted); font: 400 13px var(--mono); }
.lock input { width: 100%; font: 500 16px var(--mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: center; letter-spacing: .04em; }
.lock button { width: 100%; padding: 14px; font-size: 14px; font-weight: 700; color: #0b0c0e; background: var(--lime); border-color: var(--lime); border-radius: 12px; }
.lock .err { color: #ff8a8a; min-height: 1.2em; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form id="lockform" autocomplete="on">
    <img src="../icon-192.png" alt="">
    <h2>periph stats</h2>
    <p>Enter the password once on this device.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="password" aria-label="Password" required>
    <button type="submit">Unlock</button>
    <p class="err" id="pwerr" role="alert"></p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <div class="brand"><img src="../icon-192.png" alt=""><h1>periph downloads</h1></div>
    <div class="live"><span class="dot" id="dot"></span><span id="when">loading…</span><button id="refresh" type="button">Refresh</button></div>
  </header>

  <section class="hero">
    <div class="card"><div class="label">Total downloads</div><div class="big" id="total">0</div><div class="sub" id="releases">—</div></div>
    <div class="card"><div class="label os"><i style="background:var(--lime)"></i>Windows</div><div class="mid" id="win">0</div><div class="sub" id="winp">—</div></div>
    <div class="card"><div class="label os"><i style="background:var(--mac)"></i>macOS</div><div class="mid" id="mac">0</div><div class="sub" id="macp">—</div></div>
  </section>

  <section class="card split">
    <h2>Windows vs macOS</h2>
    <div class="bar"><div class="w" id="bw"></div><div class="m" id="bm"></div></div>
    <div class="legend"><span id="lw">Windows —</span><span id="lm">macOS —</span></div>
  </section>

  <section class="card table">
    <h2>By release</h2>
    <div class="wrap"><table>
      <thead><tr><th>Release</th><th>Published</th><th class="num">Windows</th><th class="num">macOS</th><th class="num">Total</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="msg" id="msg" hidden></p>
  </section>
</main>
<script>
// Live download counts for periph, read straight from GitHub Releases (hiuih/periph-site).
// Unlisted page behind a one-time password (remembered on this device). The counts
// themselves are public on GitHub; the password just keeps this page to yourself.
const REPO = "hiuih/periph-site";
const SALT = "92f8cba20e7553cda4617f34d955efaf";
const HASH = "a53c291ce0e419f7f54f3f09483b727eef7da0b91361dd93889cdc73a23b18ae";
const KEY = "periph-stats-unlock";
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat("en");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const shown = {};

const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
async function derive(pw) {
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unhex(SALT), iterations: 200000 }, k, 256));
}
const remembered = () => { try { return localStorage.getItem(KEY) === HASH; } catch (e) { return false; } };

function tick(id, to) {
  const el = $(id), from = shown[id] ?? 0;
  shown[id] = to;
  if (reduce || from === to) { el.textContent = fmt.format(to); return; }
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = fmt.format(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const pct = (n, t) => (t ? Math.round((n / t) * 100) + "%" : "—");

async function load() {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`, { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 403 ? "GitHub rate limit hit, try again in a bit." : `GitHub said ${r.status}.`);
    const rels = await r.json();
    let win = 0, mac = 0;
    const rows = rels.map((rel) => {
      const w = rel.assets.filter((a) => /\.exe$/i.test(a.name)).reduce((s, a) => s + a.download_count, 0);
      const m = rel.assets.filter((a) => /\.dmg$/i.test(a.name)).reduce((s, a) => s + a.download_count, 0);
      win += w; mac += m;
      return { tag: rel.tag_name, date: (rel.published_at || "").slice(0, 10), w, m };
    });
    const total = win + mac;
    tick("total", total); tick("win", win); tick("mac", mac);
    $("releases").textContent = `${rows.length} release${rows.length === 1 ? "" : "s"}`;
    $("winp").textContent = `${pct(win, total)} of downloads`;
    $("macp").textContent = `${pct(mac, total)} of downloads`;
    $("bw").style.width = total ? (win / total) * 100 + "%" : "0%";
    $("bm").style.width = total ? (mac / total) * 100 + "%" : "0%";
    $("lw").textContent = `Windows ${fmt.format(win)}`;
    $("lm").textContent = `macOS ${fmt.format(mac)}`;
    $("rows").replaceChildren(...rows.map((x, i) => {
      const tr = document.createElement("tr");
      tr.style.animationDelay = i * 40 + "ms";
      [[x.tag], [x.date], [fmt.format(x.w), "num"], [fmt.format(x.m), "num"], [fmt.format(x.w + x.m), "num n"]].forEach(([v, c]) => {
        const td = document.createElement("td"); td.textContent = v; if (c) td.className = c; tr.append(td);
      });
      return tr;
    }));
    $("msg").hidden = true; $("dot").classList.remove("err");
    $("when").textContent = "live · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    $("dot").classList.add("err");
    $("when").textContent = "couldn't reach GitHub";
    $("msg").textContent = e.message || String(e); $("msg").hidden = false;
  }
}

function start() {
  $("lock").hidden = true; $("app").hidden = false;
  document.addEventListener("pointermove", (e) => {
    const c = e.target.closest && e.target.closest(".card"); if (!c) return;
    const b = c.getBoundingClientRect();
    c.style.setProperty("--mx", e.clientX - b.left + "px"); c.style.setProperty("--my", e.clientY - b.top + "px");
  });
  $("refresh").addEventListener("click", load);
  load();
  // Refresh every 2 minutes while visible, and whenever you come back to it
  // (GitHub allows 60 unauthenticated calls an hour per network).
  setInterval(() => { if (!document.hidden) load(); }, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}

if (remembered()) start();
else {
  $("lock").hidden = false;
  setTimeout(() => $("pw").focus(), 50);
  $("lockform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = $("lockform");
    if ((await derive($("pw").value)) === HASH) {
      try { localStorage.setItem(KEY, HASH); } catch (err) {}
      start();
    } else {
      $("pwerr").textContent = "Wrong password.";
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      $("pw").select();
    }
  });
}
</script>
</body>
</html>
